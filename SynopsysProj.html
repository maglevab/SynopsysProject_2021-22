<div id="map" style = "width:700px; height:500px;"></div>

<script type="text/javascript">
var mapProp;

function initMap() {
mapProp = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 0, lng: 0 },
    zoom: 5,
  });
const updatedRef = reference(database, "Marker Location/");
value(updatedRef, (snapshot) => {
const data = snapshot.val();
for(var key in data) {
console.log(key)
var value = data[key];
placeMarker(mapProp, new google.maps.LatLng(double(key), double(value)), "green");
}
});
}
function placeMarker(map, location, state) {
var url = "http://maps.google.com/mapfiles/ms/icons/";
url += state+"-dot.png";
var marker = new google.maps.Marker({
position: location,
map: map,
icon: {
url: url,
}
});
var window = new google.maps.InfoWindow({
content: "latitude: " + location.lat() + "<br> longitude: " + location.lng()
});
window.open(map, marker)
}

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8nxDDKxERrXebxG8FkDf_Xr5yUeBEd4A&callback=initMap"></script>
